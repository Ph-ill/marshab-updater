server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # The release list and the runtime list change whenever a release is published.
    location = /firmware/index.json {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /firmware/runtime.json {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # A bench build can be rebuilt under the same version, so revalidate (ETag)
    # instead of caching forever. The browser checks every sha256 anyway.
    location /firmware/releases/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # No GitHub API proxy: the release list is a static file in this repo and the
    # MicroPython runtimes are plain links to micropython.org.
    location /github-api/ {
        return 404;
    }

    location / {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
