<text x="40" y="72" font-size="16" text-anchor="start" font-weight="normal" fill="#555" font-family="DejaVu Sans">Both boards seen from the top. 5 wires, 1 Schottky diode, 2 resistors. Steps, checks and what is unverified: game/docs/BATTERY.md</text>
