async function api(path,body){
  // The phone's clock rides along: the ship has none, and learns the time from this (lv/clock.py).
  const o={headers:{"X-Crew-Token":tok,"X-Phone-Time":String(Date.now()),"X-Phone-TZ":String(-new Date().getTimezoneOffset())}};
  if(body){o.method="POST";o.body=JSON.stringify(body);o.headers["Content-Type"]="application/json"}
  const r=await fetch(path+(path.startsWith("/api/")?DQ:""),o);
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&path!=="/api/me"){tok="";me=-1;go("hello");throw new Error("signed out")}
  if(!r.ok)throw Object.assign(new Error(j.err||"The ship didn't answer. Try again."),{j,status:r.status});
  return j;
}

// ---- live updates: WebSocket, falling back to polling ---------------------------------
function live(){
  try{
    ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
    ws.onmessage=(m)=>{const v=JSON.parse(m.data).v;if(S&&v!==S.v)refresh().catch(lost)};
    ws.onclose=ws.onerror=()=>{ws=null;startPoll()};
  }catch(e){startPoll()}
}
function startPoll(){
  if(poll)return;net="poll";
  poll=setInterval(async()=>{try{const j=await api("/api/v");if(S&&(net==="lost"||j.v!==S.v))await refresh()}catch(e){lost(e)}},15000);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&tok)refresh().catch(lost)});
// The ship went quiet (out of Wi-Fi range, or rebooting): keep showing the last copy and say so.
function lost(e){if(e&&e.message==="signed out")return;if(S&&net!=="lost"){net="lost";view()}}

async function refresh(){
  S=await api("/api/state");
  if(net==="lost")net=poll?"poll":"live";
  lines=null;engSeen();
  view();
}

// ---- story ----------------------------------------------------------------------------
function story(){
  if(lines)return lines;
  const raw=Uint8Array.from(atob(S.story),(c)=>c.charCodeAt(0));
  R=new Renderer(T,EG,S.you);
  const days={};
  for(let i=0;i+8<=raw.length;i+=8){
    const e=Array.from(raw.slice(i,i+8)),d=e[0],code=e[1];
    const L=days[d]||(days[d]={big:[],fold:0});
    if(code===O.ACT&&e[6]===1&&e[4]!==0){L.fold++;continue}
    let s;R.hit=false;
    // Someone else's instruction: "on your word" would read as if you gave it.
    if(code===O.ACT&&e[3]!==S.you&&!e[6]){const k=R.t.actions;R.t.actions=k.map((x)=>({...x,you:x.owner||x.you}));s=R.entry(e);R.t.actions=k}
    else if(code===O.DIL_OPEN&&e[3]!==S.you){R.roles.set(e[2],[e[3],NONE]);s=R.fill(T.sys.dil_open,e[3])}
    else s=R.entry(e);
    if(!s)continue;
    const me=R.hit;
    const mine=(code===O.ACT&&e[3]===S.you)||(code===O.DIL_CLOSE&&e[3]===S.you&&!e[5]);
    L.big.push({s:s.trim(),me,cls:mine?"you":[O.EVENT,O.DEC_CLOSE,O.RES_CLOSE,O.DIL_CLOSE,O.END,O.DEC_OPEN,O.RES_OPEN].includes(code)?"big":""});
  }
  return(lines=days);
}
function dayList(d,max){
  const L=story()[d];
  if(!L)return"<li class=fold>A quiet day.</li>";
  let out=L.big.slice(0,max||99).map((x)=>`<li class="${x.cls}">${h(x.s)}</li>`).join("");
  if(L.fold)out+=`<li class=fold>${L.fold===1?"One chore":L.fold+" chores"} done without being asked.</li>`;
  return out;
}

function ticks(v,n){
  // n ticks either side of zero, filled from the centre to the value.

  let s="";
  for(let i=-n;i<=n;i++){
    const x=(i+n)/W*96+2,lit=i===0||(on>0&&i>0&&i<=on)||(on<0&&i<0&&i>=on);
    const y=i===0?2:lit?6:12;
    s+=`<line x1="${x.toFixed(2)}" x2="${x.toFixed(2)}" y1="${y}" y2="22" stroke="var(--${lit?"ink":"graph"})" stroke-width="${lit?1.6:.8}" vector-effect="non-scaling-stroke"/>`;
  }
  return `<svg viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="100" y1="22" y2="22" stroke="var(--ink)" stroke-width="1" vector-effect="non-scaling-stroke"/>${s}</svg>`;
}
function meter(v){
  // 0-100 as 20 ticks filled from the left (no bars: tick gauges only).

}

function traj(){

      [["Wi-Fi","Your phone talks to the ship it's next to. Your crew code works on every ship."],["Bluetooth","Ships near each other swap news by themselves: plans, answers, ballots, gifts."],["Out of range","A ship keeps everything and catches up the next time it meets another."]]],
    ["Your day","One flight day a day",`A new flight day starts every ${st0<720?"morning":"day"} at ${hm(st0)}, real time, for ${wk}. Each one adds a page to the log and brings something new to do.`,tFig(1),
      [["Each day","Read the page, pick your plan, answer what's waiting. That's the rhythm."],["Why daily","Plans land on the next flight day and questions close on set days. Checking in is how you steer."],["Nobody waits","If you're away, you carry on in character. Nothing holds up anyone else."]]],
    ["Your plan","One plan a day","Pick one thing to do each flight day. It takes effect when the next flight day starts. Once sent, it's set. Skip a day and you act on your own character.","",
      [["Gift","You warm to one crewmate, and their morale lifts."],["Yourself","Nudges one side of your character a little."],["Task","Tops up a fleet store, at a small cost to your morale."],["Rest","Your morale comes back up."]]],
    ["Needs you","What's waiting on you",`Home lists only what's waiting on you, each with the flight day it closes. New ones carry a rust mark. Answer in time, or it settles itself.`,"",
      [["Private",`Only you are asked, and nobody sees your pick. Leave it, and you go on instinct, in character.`],["Anyone","Any ship can answer it. One tap from anywhere is enough."],["Fleet vote","One ballot per ship. Most ballots by the closing day wins; a tie or none goes the crew's way. You can change yours until it closes."]].concat(EG?[["Timed job","Your job for the day. The result posts at the time shown."]]:[])]];
  if(EG)st.push(
    ["Deliveries","Drops and cargo",`Small extras on top of your plan. None are required, all are nice.`,"",
      [["Daily drop","One sealed item for your ship each flight day. It keeps until you open it."],["Gift",`Send one crewmate one gift a flight day. It warms the bond and lifts their morale.`],["Ask",`Ask one crewmate for something. They have ${EG.gifts.ask_days} days to send it, then it lapses quietly.`],["Cargo in","Anything sent to you waits on Home."]]]);
  st.push(
    ["Bluetooth","How things travel",`Everything you send leaves right away. Your ship keeps it and hands it on by Bluetooth to any ship in range. Ships pass things along for each other, too.`,"",
      [["Nearby","Their ship is in range now, so it lands within a minute or so."],["Not nearby","It waits, then travels the next time ships meet, directly or by way of another ship."],["Who's near",`CREW and the gift list show who's nearby, and when each ship was last in range.`],["Counts lag","Vote counts show what your ship has heard so far. They catch up."]]]);
  if(EG)st.push(
    ["Watch duty","Keeping watch",`Anything you send on a flight day counts as a watch: a plan, a ballot, an answer, a gift or an ask. Days in a row make a run.`,tFig(5),
      [["Grace days","Miss a day and it's covered, up to twice a flight week. Today never counts against you."],["Badges",`Awarded at ${EG.badges.map((b)=>b[0]).join(", ").replace(/, (\d+)$/," and $1")} days.`],["Broken run","A new run starts with your next tap. No harm done."]]]);
  if(S.led!=null)st.push(
    ["Ship light","A light on the ship",`Your ship's light can glow, softly pulsing, to say something's waiting, no phone needed. It's off until someone turns it on: Settings (the gear, top right) › Ship light.`,"",
      [["One slow pulse","Every few seconds: today's page hasn't been opened here yet."],["Double pulse","A crewmate's gift has reached this ship."],["Three quick","A new flight day has begun."],["Off again","Opening the game here clears it. Dark at night, 22:00 to 07:00."]]]);
  st.push(["The log","Missed a few days?",`No problem. The log reads newest page first, and pages new since your last visit carry a rust square. Catch up whenever you like.`,"",
    [["While away","You carry on in character, and votes close with whoever voted."],["Late signals","Today's and yesterday's pages can still change as word arrives from other ships. That's normal."],["Filed under",`${file} › How to play, for when you need it again.`]]]);
  return st;
}
function how(n){
  const L=TUT();n=Math.min(Math.max(0,n|0),L.length-1);
  const [k,t,p,fig,li]=L[n],last=n===L.length-1;
  $("top").hidden=false;$("top").innerHTML=`<b>CREW BRIEFING</b>${last?`<span>${pad(n+1)}/${pad(L.length)}</span>`:`<button data-tut=skip class=m style="height:48px;padding:0 0 0 16px;font-size:15px;text-decoration:underline">Skip</button>`}`;
  let o=`<section class="kick tut" aria-labelledby=th aria-roledescription="briefing card"><div class=lab style="display:flex;justify-content:space-between;gap:var(--s3)"><span>${n<3?"Intro":"Briefing"} ${pad(n+1)}/${pad(L.length)}</span><span>${k}</span></div>`;
  o+=`<ol class=tsteps aria-hidden=true>${L.map((_,i)=>`<li class="${i<n?"d":i===n?"c":""}"></li>`).join("")}</ol>`;
  o+=`<h1 id=th tabindex=-1><span class=sr>Step ${n+1} of ${L.length}: </span>${t}</h1><p class=lead>${p}</p>${fig?fig.replace("<svg",'<svg aria-hidden="true"'):""}`;
  o+=`<ul class=bl>${li.map(([a,b])=>`<li><b>${a}</b><span>${b}</span></li>`).join("")}</ul>`;
  if(last)o+=`<p class=fine>Issued to all crews. Retain this card, or don't: it is filed under How to play.</p>`;
  $("v").innerHTML=o+`</section>`;
  dock(`<div class=tnav>${n?`<button class="btn sec" data-tut=back aria-label="Previous card"><span>Back</span></button>`:`<button class="btn sec" data-tut=skip><span>Skip</span></button>`}<button class="btn pri" data-tut="${last?"done":"next"}"><span>${last?"Go aboard":"Next"}</span><i>${last?"done":pad(n+2)+"/"+pad(L.length)}</i></button></div>`,"");
  requestAnimationFrame(()=>$("th")&&$("th").focus({preventScroll:true}));
}
function tutStep(){return +(route.split("/")[1]||0)}
function tutKey(v){
  const n=tutStep();
  if(v==="next")return go("how/"+(n+1));
  if(v==="back")return go("how/"+Math.max(0,n-1));
  briefDone();
}
document.addEventListener("keydown",(e)=>{
  if(!route.startsWith("how")||e.altKey||e.ctrlKey||e.metaKey)return;
  const n=tutStep(),m=TUT().length-1;
  if(e.key==="ArrowRight"&&n<m){e.preventDefault();tutKey("next")}
  else if(e.key==="ArrowLeft"&&n>0){e.preventDefault();tutKey("back")}
  else if(e.key==="Escape"){e.preventDefault();briefDone()}
});

// ---- routing & input ------------------------------------------------------------------
let route="hello";
function go(r){
  const n=r!==route;
  if(n&&r.startsWith("how")&&!route.startsWith("how"))tutFrom=route.startsWith("meet")||route.startsWith("pin")?"home":route;
  if(n){route=r;history.replaceState(null,"","#"+r);scrollTo(0,0);if(!r.startsWith("log"))logCut=-1}
  view();
  if(n&&!RM.matches&&$("v").animate)$("v").animate([{opacity:0,transform:"translateY(6px)"},{opacity:1,transform:"none"}],{duration:140,easing:"cubic-bezier(.2,.7,.3,1)"});
}
function view(){
  if(!tok&&!["hello","pin"].includes(route))route="hello";
  if(R)R.me=S&&S.you!=null?S.you:NONE; // the signed-in astronaut reads as "you"
  const [a,b]=route.split("/");
  try{
    if(a==="hello")return hello();
    if(a==="pin")return pinScreen();
    if(!S)return;
    if(a==="meet")return meet();
    if(a==="crew")return crew(b!=null?+b:null);
    if(a==="log")return log(b!=null?+b:0);
    if(a==="item")return item(+b);
    if(a==="act")return actSheet();
    if(a==="how")return how(+b||0);
    if(EG&&S.eng&&ENG[a])return ENG[a](b);
    if(a==="end")return S.ending!==NONE?ending():home();
    if(a==="epilogue")return epilogue();
    return home();
  }finally{if(net!=="live"&&tok&&S)$("v").insertAdjacentHTML("afterbegin",net==="lost"?"<div class=off role=status>No signal · last copy shown<button data-retry=1>Retry</button></div>":"<div class=off role=status>Live link down · checking every 15 s</div>")}
}
// Lockout countdown: the ship decides when it ends; the phone's clock only draws the minutes.
function lockLeft(){const u=lockUntil[me];return u?Math.max(0,Math.ceil((u-Date.now())/1000)):0}
let lockT=0;
function lockTick(){clearInterval(lockT);lockT=setInterval(()=>{if(route!=="pin"){clearInterval(lockT);return}if(!lockLeft()){clearInterval(lockT);delete lockUntil[me]}pinScreen()},1000)}
let busy=false;
async function key(k){
  if(k==="BACK"){pin="";busy=false;return go("hello")}
  if(busy)return;   // a code is on its way to the ship: don't start the next one
  if(k==="DEL")pin=pin.slice(0,-1);
  else if(pin.length<4)pin+=k;
  pinScreen();
  if(pin.length===4){
    busy=true;
    try{
      const j=await api("/api/login",{crew:me,pin});
      tok=j.token;pin="";busy=false;tutDue=!!j.first&&!briefed();
      await refresh();live();
      go(j.first?"meet":"home");
    }catch(e){
      pin="";const j=e.j||{};
      if(j.wait){lockUntil[me]=Date.now()+j.wait*1000;lockTick()}
      busy=false;
      pinScreen(j.wait?"":j.left!=null?`That code doesn't match. ${j.left} ${j.left===1?"try":"tries"} left.`:e.message);
    }
  }
}
document.addEventListener("click",async(ev)=>{
  const el=ev.target.closest("button");if(!el||el.disabled)return;
  const D=el.dataset;
  if(D.go){if(D.go==="act")draft=null;return go(D.go)}
  if(D.eng)return engClick(el,D.eng);
  if(D.tut)return tutKey(D.tut);
  if(D.who){me=+D.who;pin="";if(lockLeft())lockTick();return go("pin")}
  if(D.out){
    try{await api("/api/logout",{})}catch(e){}
    if(ws){ws.onclose=ws.onerror=null;ws.close();ws=null}
    clearInterval(poll);poll=0;net="live";tok="";me=-1;S=null;return go("hello");
  }
  if(D.led){el.disabled=true;try{const j=await api("/api/led",{on:!S.led});S.led=!!j.led}catch(e){}return view()}
  if(D.key)return key(D.key);
  if(D.retry){if(!T)return location.reload();el.disabled=true;return refresh().catch(()=>{el.disabled=false})}
  if(D.pick){const [c,i]=D.pick.split(":").map(Number);pick[c]=i;return view()}
  if(D.act){draft={a:D.act==="x"?null:+D.act,p:null,t:null};return view()}
  if(D.sub){const p=D.sub.split(":");if(p[0]==="t")draft.t=+p[1];else{draft.p=+p[1];if(p[2]!=null)draft.t=+p[2]}return view()}
  if(D.send){
    el.disabled=true;
    try{
      if(D.send==="act"){const d=draft;await api("/api/act",{act:d.a,param:d.p||0,tgt:d.t||0});draft=null;await refresh();return go("home")}
      const c=+D.send,o=S.open.find((x)=>x.card===c);
      await api(o.type===4?"/api/answer":"/api/vote",{card:c,opt:pick[c]});
      delete pick[c];await refresh();
    }catch(e){el.disabled=false;const d=$("dock");d.querySelector(".off")?.remove();d.insertAdjacentHTML("afterbegin",`<div class=off role=alert>${h(e.message)}</div>`)}
  }
});
// ?probe: a one-line readout of what the page really gets (for measuring the captive sheet on a real phone).
if(/[?&]probe\b/.test(location.search)){
  const z=document.createElement("div");
  z.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--ink);color:var(--paper);font:12px/16px var(--mono);padding:4px 8px calc(4px + var(--sb))";
  const sa=document.createElement("div");sa.style.cssText="position:fixed;visibility:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)";
  document.body.append(z,sa);
  const ua=navigator.userAgent,ios=/iPhone|iPad/.test(ua);
  const upd=()=>{const c=getComputedStyle(sa),v=window.visualViewport;
    z.textContent=`${innerWidth}x${innerHeight} vv ${v?Math.round(v.width)+"x"+Math.round(v.height):"-"} safe ${c.paddingTop}/${c.paddingBottom} dpr ${devicePixelRatio} ${ios?(/Safari\//.test(ua)?"iOS Safari":"iOS sheet"):/; wv\)/.test(ua)?"Android WebView":"browser"}`};
  upd();addEventListener("resize",upd);window.visualViewport?.addEventListener("resize",upd);
}
function fail(){
  bar("THE LONG VOYAGE","NO SIGNAL");
  $("v").innerHTML=`<div class=kick role=alert><div class="lab r">Link status</div><h1>No signal from the ship</h1><p>This phone has to be on the ship's own <span style="white-space:nowrap">Wi-Fi</span> to reach it. Stay close to the model, check the <span style="white-space:nowrap">Wi-Fi</span> settings, then try again.</p></div>`;
  dock(`<button class="btn pri" data-retry=1><span>Try again</span><i>reload</i></button>`,"");
}
(async()=>{
  try{T=await (await fetch("/text.json")).json()}catch(e){return fail()}
  await engLoad();
  R=new Renderer(T,EG);
  try{crewInfo(await api("/api/crew"))}catch(e){}
  // Signed in on this phone earlier today? The ship remembers it (by IP and browser) until the next flight day.
  try{const j=await api("/api/me");tok=j.token;me=j.crew;await refresh();live();route="home"}catch(e){}
  view();
})();
</script>
