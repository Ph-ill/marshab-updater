services:
  marshab-updater:
    build: .
    container_name: marshab-updater
    restart: unless-stopped
    ports:
      # loopback only: the public site reaches the container over Shared (NPM -> marshab-updater:80)
      - "127.0.0.1:${MARSHAB_HOST_PORT:-8080}:80"
    networks:
      - Shared

networks:
  Shared:
    external: true
